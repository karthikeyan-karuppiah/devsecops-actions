# =============================================================================
# Pipeline 1: Continuous Integration / Action Validation & Linting
# =============================================================================
# Core Architecture & Security Model:
#   1. Zero-Trust Permissions: Top-level permissions locked down; least-privilege
#      `contents: read` granted strictly at the job level.
#   2. Credential Hygiene: Disables persisted Git credentials on checkout to
#      prevent unintended token leakage across composite action steps.
#   3. Lockfile & Static Validation: Enforces `actions.lock` pins and lints
#      workflows via actionlint before executing local `$/` composite actions.
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Workflow Trigger Configuration
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -----------------------------------------------------------------------------
# Zero-Trust Global Permissions Matrix
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  # ===========================================================================
  # Job: Lint Workflows and Execute Local Composite Action Smoke Tests
  # ===========================================================================
  test-actions:
    name: Test Composite Actions
    runs-on: ubuntu-latest
    # Fail-safe timeout to prevent hung container builds or security scans
    timeout-minutes: 15

    # Least-privilege repository read access required for checkout and local actions
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # Workspace Checkout
      # -----------------------------------------------------------------------
      # Uses the exact locked version (`v4.4.0`) from `actions.lock` and disables
      # persisted Git credentials to prevent token leakage across action steps.
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # -----------------------------------------------------------------------
      # Static Workflow & Action Syntax Validation
      # -----------------------------------------------------------------------
      # Installs actionlint v1.7.12 via Go (with checksum verification) and
      # runs it with `-ignore` to allow `$/` local lockfile action paths.
      - name: Lint workflow and action YAML files
        run: |
          set -euo pipefail
          go install ://github.com
          actionlint -ignore 'specifying action "[$]/'



      # -----------------------------------------------------------------------
      # Local Composite Action Integration Tests
      # -----------------------------------------------------------------------
      # Validates commit conventions on direct pushes to `main` (skipped on PRs)
      - name: Test validate-push-commit
        if: github.event_name == 'push'
        uses: $/validate-push-commit

      # Validates Dockerfile / container linting rules against repository fixtures
      - name: Test lint-containers
        uses: $/lint-containers

      # Validates Trivy vulnerability and misconfiguration scanning execution
      - name: Test trivy-security
        uses: $/trivy-security
