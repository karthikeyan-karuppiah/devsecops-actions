# =============================================================================
# Pipeline 1: Continuous Integration / Action Validation & Integration Tests
# =============================================================================
# Core Architecture & Security Model:
#   1. Zero-Trust Permissions: Top-level permissions locked down; least-privilege
#      `contents: read` granted strictly at the job level.
#   2. Credential Hygiene: Disables persisted Git credentials on checkout to
#      prevent unintended token leakage across composite action steps.
#   3. Lockfile & Static Validation: Enforces `actions.lock` pins and lints
#      workflows via actionlint before executing local `$/` composite actions.
#   4. End-to-End Integration Testing: Executes every composite action against
#      hardened fixtures in `tests/fixtures/` and asserts expected outputs.
# =============================================================================

name: CI

# -----------------------------------------------------------------------------
# Workflow Trigger Configuration
# -----------------------------------------------------------------------------
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# -----------------------------------------------------------------------------
# Zero-Trust Global Permissions Matrix
# -----------------------------------------------------------------------------
permissions: {}

jobs:
  # ===========================================================================
  # Job: Lint Workflows and Execute Local Composite Action Integration Tests
  # ===========================================================================
  test-actions:
    name: Test Composite Actions
    runs-on: ubuntu-latest
    # Fail-safe timeout to prevent hung container builds or security scans
    timeout-minutes: 15

    # Least-privilege repository read access required for checkout and local actions
    permissions:
      contents: read

    steps:
      # -----------------------------------------------------------------------
      # Workspace Checkout
      # -----------------------------------------------------------------------
      # Uses the exact locked version (`v4.4.0`) from `actions.lock` and disables
      # persisted Git credentials to prevent token leakage across action steps.
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      # -----------------------------------------------------------------------
      # Static Workflow & Action Syntax Validation
      # -----------------------------------------------------------------------
      # Installs actionlint v1.7.12 via Go (with checksum verification) and
      # runs it with `-ignore` to allow `$/` local lockfile action paths.
      - name: Lint workflow and action YAML files
        run: |
          set -euo pipefail
          go install ://github.com
          "$(go env GOPATH)/bin/actionlint" -ignore 'specifying action "[$]/'

      # -----------------------------------------------------------------------
      # Integration Test 1: Conventional Commit Gate
      # -----------------------------------------------------------------------
      # Validates commit conventions on direct pushes to `main` (skipped on PRs)
      - name: Test validate-push-commit
        id: test-commit
        if: github.event_name == 'push'
        uses: $/validate-push-commit

      # -----------------------------------------------------------------------
      # Integration Test 2: Container, Compose & YAML Linting
      # -----------------------------------------------------------------------
      # Lints repository YAML files plus `tests/fixtures/compose.yaml` and
      # `tests/fixtures/Dockerfile` with strict enforcement enabled.
      - name: Test lint-containers
        id: test-lint
        uses: $/lint-containers
        with:
          enforce-compose-lint: 'true'
          hadolint-threshold: 'warning'

      - name: Verify lint-containers outputs
        run: |
          set -euo pipefail
          test "${{ steps.test-lint.outputs.compose-files-found }}" = "true"
          test "${{ steps.test-lint.outputs.dockerfiles-found }}" = "true"
          echo "✅ Verified compose-files-found=true and dockerfiles-found=true"

      # -----------------------------------------------------------------------
      # Integration Test 3: Trivy Security Scan, SBOM & SARIF Generation
      # -----------------------------------------------------------------------
      # Scans repository filesystem and `tests/fixtures/compose.yaml` images,
      # verifying both CycloneDX SBOM and SARIF outputs are generated.
      - name: Test trivy-security
        id: test-trivy
        uses: $/trivy-security
        with:
          severity: 'CRITICAL,HIGH'
          enforce-fs-findings: 'true'
          enforce-image-cves: 'true'
          ignore-unfixed: 'true'
          sbom-dir: '/tmp/test-sboms'
          sarif-file: '/tmp/trivy-test.sarif'

      - name: Verify trivy-security outputs
        run: |
          set -euo pipefail
          test -f "/tmp/test-sboms/alpine_3.21.3.cdx.json"
          test -f "/tmp/trivy-test.sarif"
          echo "✅ Verified CycloneDX SBOM and SARIF outputs exist"
