name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Updates the floating major tag (e.g., v1) whenever a new release is cut
      - name: Update floating major tag
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          MAJOR_TAG: v${{ steps.release.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "devsecops-actions[bot]"
          git config user.email "41898282+devsecops-actions[bot]@://github.com"
          git fetch origin "$TAG_NAME"
          git tag -f "$MAJOR_TAG" "$TAG_NAME^{}"
          git push origin "$MAJOR_TAG" --force
