version: 2
updates:
  # Automatically update pinned actions in workflows, composite actions, and actions.lock
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/validate-push-commit"
      - "/lint-containers"
      - "/trivy-security"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "security"
