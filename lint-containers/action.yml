# =============================================================================
# Composite Action: Static Analysis & Container Configuration Linting
# =============================================================================
# Purpose:
#   Provides a multi-layered static analysis and security posture gate for
#   containerized infrastructure repositories (YAML, Docker Compose, Dockerfiles).
#
# Pipeline Stages:
#   1. YAML Syntax & Formatting Analysis (yamllint)
#   2. Docker Compose Schema & Structure Validation (`docker compose config --no-interpolate`)
#   3. CIS Docker Benchmark & OWASP Compose Security Audit (`compose-lint` in isolated venv)
#   4. Conditional Dockerfile Best-Practice Linting (`hadolint`)
#
# Adoption Strategy:
#   - `enforce-compose-lint` defaults to `'false'` so teams can surface
#     security posture findings (privileged containers, missing resource limits,
#     root users, 0.0.0.0 bindings) immediately without blocking delivery while
#     hardening existing stacks.
# =============================================================================

name: 'Lint Containers & Compose'
description: 'Runs YAML lint, Docker Compose schema validation, compose-lint security checks, and Hadolint'

branding:
  icon: 'layers'
  color: 'blue'

# -----------------------------------------------------------------------------
# Action Interface: Configurable Inputs & Outputs
# -----------------------------------------------------------------------------
inputs:
  enforce-compose-lint:
    description: 'Fail the workflow if compose-lint detects security misconfigurations ("true" or "false")'
    required: false
    default: 'false'
  compose-lint-version:
    description: 'Pinned compose-lint PyPI package version to install (leave empty for latest)'
    required: false
    default: ''
  run-yamllint:
    description: 'Enable repository-wide YAML linting via yamllint ("true" or "false")'
    required: false
    default: 'true'
  yamllint-config-file:
    description: 'Optional path to a custom .yamllint configuration file (uses built-in defaults if empty)'
    required: false
    default: ''
  hadolint-threshold:
    description: 'Minimum severity threshold to fail Hadolint (error, warning, info, style, ignore)'
    required: false
    default: 'warning'

outputs:
  compose-files-found:
    description: 'Indicates whether any Docker Compose files were detected and linted ("true" or "false")'
    value: ${{ steps.compose-lint.outputs.found }}
  dockerfiles-found:
    description: 'Indicates whether any Dockerfiles were detected and linted ("true" or "false")'
    value: ${{ steps.dockerfiles.outputs.found }}

# -----------------------------------------------------------------------------
# Execution Engine: Composite Steps
# -----------------------------------------------------------------------------
runs:
  using: 'composite'
  steps:
    # -------------------------------------------------------------------------
    # Stage 1: YAML Syntax & Formatting Analysis
    # -------------------------------------------------------------------------
    - name: Lint YAML files (built-in defaults)
      if: inputs.run-yamllint == 'true' && inputs.yamllint-config-file == ''
      uses: ibiqlik/action-yamllint@v3.1.1
      with:
        config_data: |
          extends: default
          rules:
            line-length: disable
            document-start: disable

    - name: Lint YAML files (custom config)
      if: inputs.run-yamllint == 'true' && inputs.yamllint-config-file != ''
      uses: ibiqlik/action-yamllint@v3.1.1
      with:
        config_file: ${{ inputs.yamllint-config-file }}

    # -------------------------------------------------------------------------
    # Stage 2: Docker Compose Schema & Structure Verification
    # -------------------------------------------------------------------------
    # Uses `--no-interpolate` so missing runtime `.env` secrets do not cause
    # false-positive validation failures during static CI checks.
    - name: Validate Docker Compose syntax
      shell: bash
      run: |
        set -euo pipefail
        mapfile -t COMPOSE_FILES < <(
          find . -not -path '*/.git/*' -type f \( \
            -name "docker-compose.yml" -o \
            -name "docker-compose.yaml" -o \
            -name "compose.yml" -o \
            -name "compose.yaml" \
          \) | sort
        )

        for file in "${COMPOSE_FILES[@]}"; do
          echo "→ Validating schema & structure: $file"
          docker compose -f "$file" config --no-interpolate --quiet
        done

    # -------------------------------------------------------------------------
    # Stage 3: Docker Compose Security Posture Audit (compose-lint)
    # -------------------------------------------------------------------------
    # Installs compose-lint inside an isolated virtual environment to comply
    # with PEP 668 on modern Ubuntu runners without polluting global packages.
    - name: Scan Docker Compose for security misconfigurations
      id: compose-lint
      shell: bash
      env:
        ENFORCE: ${{ inputs.enforce-compose-lint }}
        LINT_VERSION: ${{ inputs.compose-lint-version }}
      run: |
        set -euo pipefail

        mapfile -t COMPOSE_FILES < <(
          find . -not -path '*/.git/*' -type f \( \
            -name "docker-compose.yml" -o \
            -name "docker-compose.yaml" -o \
            -name "compose.yml" -o \
            -name "compose.yaml" \
          \) | sort
        )

        if [ ${#COMPOSE_FILES[@]} -eq 0 ]; then
          echo "⚠ No Docker Compose files found – skipping"
          echo "found=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "found=true" >> "$GITHUB_OUTPUT"
        echo "=== Installing compose-lint in isolated venv ==="
        python3 -m venv /tmp/compose-lint-venv
        if [ -n "$LINT_VERSION" ]; then
          /tmp/compose-lint-venv/bin/pip install --quiet "compose-lint==${LINT_VERSION}"
        else
          /tmp/compose-lint-venv/bin/pip install --quiet compose-lint
        fi

        echo
        echo "=== Scanning ${#COMPOSE_FILES[@]} Docker Compose file(s) ==="
        FAILED=0

        for file in "${COMPOSE_FILES[@]}"; do
          echo "→ Scanning $file"
          if ! /tmp/compose-lint-venv/bin/compose-lint "$file"; then
            FAILED=1
          fi
          echo
        done

        if [ "$FAILED" -eq 1 ]; then
          if [ "$ENFORCE" = "true" ]; then
            echo "❌ compose-lint found security misconfigurations (blocking gate enabled)."
            exit 1
          fi
          echo "⚠ compose-lint found security issues (non-blocking audit mode)."
          echo "   Set enforce-compose-lint: 'true' once findings are remediated."
          exit 0
        fi

        echo "✅ No critical Compose security issues found."

    # -------------------------------------------------------------------------
    # Stage 4: Conditional Dockerfile Best-Practice Linting (Hadolint)
    # -------------------------------------------------------------------------
    - name: Check for Dockerfiles
      id: dockerfiles
      shell: bash
      run: |
        set -euo pipefail
        if find . -not -path '*/.git/*' -type f \( -name "Dockerfile" -o -name "*.dockerfile" -o -name "Dockerfile.*" \) | grep -q .; then
          echo "found=true" >> "$GITHUB_OUTPUT"
        else
          echo "found=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Lint Dockerfiles with Hadolint
      if: steps.dockerfiles.outputs.found == 'true'
      uses: hadolint/hadolint-action@v3.5.0
      with:
        failure-threshold: ${{ inputs.hadolint-threshold }}
        recursive: true
